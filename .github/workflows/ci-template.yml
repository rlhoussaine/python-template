name: CI Template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Template repository sources ─────────────────────────────────────────
  lint:
    name: Lint template sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      - name: Ruff (template tests)
        run: |
          uv run ruff format --check tests/
          uv run ruff check --output-format=github tests/

      - name: actionlint (this repository's workflows)
        run: uv run actionlint .github/workflows/*.yml

  # ── Render every option combination, regression tests ───────────────────
  render:
    name: Render & static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      - name: pytest (render + regressions)
        run: uv run pytest -m "not e2e and not docker" -n auto

  # ── Generated projects pass `just check` and `just test` ────────────────
  e2e:
    name: End-to-end (generated projects)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      # uv downloads the interpreters (3.11 → 3.14) the generated projects need.
      - name: pytest (generate, lock, check, test, build, update)
        run: uv run pytest -m e2e -n auto

  # ── Docker image of a generated project ─────────────────────────────────
  docker:
    name: Docker build (generated project)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      - name: pytest (prod image without uv nor sources, non-root)
        run: uv run pytest -m docker
