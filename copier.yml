_min_copier_version: "9.6.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

# ─── Questions ───────────────────────────────────────────────────────────────

project_name:
  type: str
  help: "Project name (e.g., Spectral Anomaly Detection)"
  validator: "{% if not project_name %}Required{% endif %}"

project_slug:
  type: str
  help: "Python package slug (snake_case)"
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %}
    Must be a valid Python identifier in snake_case (e.g., my_project)
    {% endif %}

project_description:
  type: str
  help: "Short description"
  default: "A Python project."

author:
  type: str
  help: "Author"
  default: "Your Name"

email:
  type: str
  help: "Email"
  default: "you@example.com"

ci_provider:
  type: str
  help: "Forge / CI provider"
  default: github
  choices:
    GitHub (Actions, release-please, Dependabot): github
    GitLab (GitLab CI, commitizen, Renovate): gitlab
    None: none

repository_host:
  type: str
  help: "Forge host (e.g., gitlab.my-company.fr for a self-hosted GitLab)"
  default: "{% if ci_provider == 'gitlab' %}gitlab.com{% else %}github.com{% endif %}"

repository_namespace:
  type: str
  help: "User or group owning the repository"
  default: "your-username"

python_version:
  type: str
  help: "Minimum Python version"
  default: "3.12"
  choices: ["3.11", "3.12", "3.13", "3.14"]

license:
  type: str
  help: "License"
  default: "MIT"
  choices: ["MIT", "Apache-2.0", "GPL-3.0", "Proprietary"]

use_docker:
  type: bool
  help: "Include a multi-stage Dockerfile?"
  default: true

use_cli:
  type: bool
  help: "Include a CLI (click)?"
  default: false

use_docs:
  type: bool
  help: "Include MkDocs?"
  default: false

use_data:
  type: bool
  help: "Include a data/ folder tracked with Git LFS?"
  default: false

use_notebooks:
  type: bool
  help: "Include a notebooks/ folder?"
  default: false

publish_package:
  type: bool
  help: >-
    Publish the package on release?
    (GitHub: PyPI Trusted Publishing — GitLab: project Package Registry)
  default: false
  when: "{{ ci_provider != 'none' }}"

# ─── Computed values (not asked, not stored in answers) ──────────────────────

python_versions:
  type: yaml
  default: '{{ ["3.11", "3.12", "3.13", "3.14"] | select(">=", python_version) | list | tojson }}'
  when: false

repository_url:
  type: str
  default: "https://{{ repository_host }}/{{ repository_namespace }}/{{ project_slug }}"
  when: false

# Name as normalized by uv in uv.lock (PEP 503).
distribution_name:
  type: str
  default: "{{ project_slug | replace('_', '-') }}"
  when: false

# ─── Conditional exclusions ──────────────────────────────────────────────────
_exclude:
  - "{% if not use_docs %}docs{% endif %}"
  - "{% if not use_docs %}mkdocs.yml{% endif %}"
  - "{% if not use_data %}data{% endif %}"
  - "{% if not use_data %}.gitattributes{% endif %}"
  - "{% if not use_notebooks %}notebooks{% endif %}"
  - "{% if not use_docker %}Dockerfile{% endif %}"
  - "{% if not use_docker %}.dockerignore{% endif %}"
  - "{% if not use_cli %}src/{{ project_slug }}/cli.py{% endif %}"
  - "{% if not use_cli %}tests/ut/test_cli.py{% endif %}"
  - "{% if ci_provider != 'github' %}.github{% endif %}"
  - "{% if ci_provider != 'github' %}release-please-config.json{% endif %}"
  - "{% if ci_provider != 'github' %}.release-please-manifest.json{% endif %}"
  - "{% if ci_provider != 'gitlab' %}.gitlab{% endif %}"
  - "{% if ci_provider != 'gitlab' %}.gitlab-ci.yml{% endif %}"
  - "{% if ci_provider != 'gitlab' %}renovate.json{% endif %}"

# ─── Post-generation tasks (require --trust) ─────────────────────────────────
# Make a freshly generated project immediately green: a git repository (needed
# by pre-commit and `copier update`) and an up-to-date lockfile.
_tasks:
  - command: "git init --initial-branch=main"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "uv lock"
