# Development environment of the Copier template itself (not rendered:
# copier.yml sets `_subdirectory: template`).
[project]
name = "python-template"
version = "0.3.0"
description = "Copier template for uv-first Python projects."
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12",
    "check-jsonschema>=0.38",
    "copier>=9.6",
    "pytest>=9.0",
    "pytest-xdist>=3.8",
    "ruff>=0.16",
    "rust-just>=1.40",
]

[tool.uv]
package = false
required-version = ">=0.9.11"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "PTH", "C4", "RET", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["conftest"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not docker"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "e2e: generate, lock, install and run `just check` + `just test` in the project",
    "docker: build the generated Dockerfile (requires a Docker daemon; run with -m docker)",
]
